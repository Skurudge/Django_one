{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card box-shadow my-4">
            <div class="card-header bg-primary text-white">
                <h3 class="my-0 font-weight-normal">Добавление нового товара</h3>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data" class="needs-validation">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Название товара *</label>
                        <input type="text" name="name" id="name" class="form-control {% if errors.name %}is-invalid{% endif %}" required>
                        {% if errors.name %}
                            <div class="invalid-feedback">{{ errors.name }}</div>
                        {% endif %}
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Описание *</label>
                        <textarea name="description" id="description" class="form-control {% if errors.description %}is-invalid{% endif %}" rows="4" required></textarea>
                        {% if errors.description %}
                            <div class="invalid-feedback">{{ errors.description }}</div>
                        {% endif %}
                    </div>
                    
                    <div class="mb-3">
                        <label for="price" class="form-label">Цена за покупку ($) *</label>
                        <input type="number" step="0.01" name="price" id="price" class="form-control {% if errors.price %}is-invalid{% endif %}" required>
                        {% if errors.price %}
                            <div class="invalid-feedback">{{ errors.price }}</div>
                        {% endif %}
                    </div>
                    
                    <div class="mb-3">
                        <label for="category" class="form-label">Категория</label>
                        <select name="category" id="category" class="form-select">
                            <option value="">Без категории</option>
                            {% for cat in categories %}
                                <option value="{{ cat.pk }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="image" class="form-label">Изображение товара</label>
                        <input type="file" name="image" id="image" class="form-control">
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary me-md-2">Отмена</a>
                        <button type="submit" class="btn btn-success">Сохранить товар</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
