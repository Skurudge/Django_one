<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow container">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5 d-flex align-items-center gap-2">
        <a class="p-2 btn btn-outline-primary text-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary text-primary" href="{% url 'blog:list' %}">Блог</a>

        <!-- Кнопка доступна только авторизованным пользователям -->
        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-primary text-primary" href="{% url 'catalog:add_product' %}">Добавить товар</a>
        {% endif %}

        <a class="p-2 btn btn-outline-primary text-primary" href="{% url 'catalog:my_contact' %}">Контакты</a>
    </nav>

    <!-- Блок авторизации в правой части меню -->
    <div class="ms-auto d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
            <span class="text-muted small">Вы вошли как: <strong>{{ user.email }}</strong></span>
            <a href="{% url 'users:profile' %}" class="btn btn-sm btn-outline-info">Профиль</a>
            <form action="{% url 'users:logout' %}" method="post" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'users:login' %}" class="btn btn-sm btn-outline-primary">Войти</a>
            <a href="{% url 'users:register' %}" class="btn btn-sm btn-primary text-white">Регистрация</a>
        {% endif %}
    </div>
</div>
