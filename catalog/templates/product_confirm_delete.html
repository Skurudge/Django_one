{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card box-shadow my-5 border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="my-0 font-weight-normal">Удаление товара</h3>
            </div>
            <div class="card-body py-4">
                <form method="post">
                    {% csrf_token %}
                    <p class="lead mb-4 text-start">Вы уверены, что хотите безвозвратно удалить товар <strong>"{{ object.name }}"</strong>?</p>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">Да, удалить товар</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
